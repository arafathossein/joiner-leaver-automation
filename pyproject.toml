[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jml"
version = "0.1.0"
description = "Joiner, mover and leaver automation for Microsoft 365 (Entra ID) and Google Workspace: dry-run plans, safe idempotent changes, audit evidence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
google = ["google-auth>=2.29"]
dev = ["pytest>=8"]

[project.scripts]
jml = "jml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
